<!doctype html>
<html lang="sv" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Svampkartan</title>
  <meta name="description" content="Dina svampställen på kartan">
  <meta name="theme-color" content="#FBF4E6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Svampkartan">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var t = localStorage.getItem('svamp-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>

  <main id="view-loading" class="center">
    <div class="spinner" aria-label="Laddar"></div>
  </main>

  <main id="view-login" class="center" hidden>
    <section class="card login">
      <img class="logo" src="icons/icon.svg" alt="" width="72" height="72">
      <h1>Svampkartan</h1>
      <p class="muted">Dina svampställen – bara för dig.</p>

      <form id="form-login" novalidate>
        <label for="email">E-post</label>
        <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="namn@exempel.se" required>
        <label for="password" style="margin-top:12px">Lösenord</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="btn primary" type="submit">Logga in</button>
        <p class="muted small" style="margin-top:12px">Samma konto som i Jaktvind.</p>
      </form>

      <p id="login-msg" class="msg" role="status" aria-live="polite"></p>
    </section>
  </main>

  <div id="view-app" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span>Svampkartan</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="btn-theme" type="button" aria-label="Byt tema">
          <span id="theme-label">Auto</span>
        </button>
        <button class="icon-btn" id="btn-logout" type="button">Logga ut</button>
      </div>
    </header>

    <div id="map" aria-label="Karta"></div>

    <div class="map-ui">
      <button class="fab" id="btn-locate" type="button" aria-label="Visa min position">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button class="fab-main" id="btn-add" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nytt fynd
      </button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <span id="user-email" hidden></span>

    <!-- Placera fynd för hand -->
    <div id="place-ui" hidden>
      <div class="crosshair" aria-hidden="true">
        <svg viewBox="0 0 24 32" width="34" height="44"><path d="M12 1C6 1 2 5.5 2 11c0 7.5 10 20 10 20s10-12.5 10-20C22 5.5 18 1 12 1z" fill="var(--accent)" stroke="#fff" stroke-width="2"/><circle cx="12" cy="11" r="3.5" fill="#fff"/></svg>
      </div>
      <div class="place-bar">
        <p>Dra kartan så att nålen hamnar rätt</p>
        <div class="row">
          <button class="btn ghost" type="button" id="btn-place-cancel">Avbryt</button>
          <button class="btn primary" type="button" id="btn-place-ok">Använd platsen</button>
        </div>
      </div>
    </div>

    <!-- Nytt fynd -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop" id="sheet-backdrop"></div>
      <form id="form-fynd" class="sheet-panel" novalidate>
        <div class="sheet-head">
          <h2>Nytt fynd</h2>
          <button class="icon-btn" type="button" id="btn-sheet-close" aria-label="Stäng">Stäng</button>
        </div>

        <span class="lbl">Art</span>
        <div id="art-grid" class="chips"></div>

        <span class="lbl">Mängd</span>
        <div id="mangd" class="seg"></div>

        <span class="lbl">Plats</span>
        <div class="place-row">
          <span id="place-text"></span>
          <button class="icon-btn" type="button" id="btn-place">Ändra</button>
        </div>

        <label class="lbl" for="fynd-tid">Datum och tid</label>
        <input id="fynd-tid" type="datetime-local">

        <span class="lbl">Foto</span>
        <label class="photo-pick">
          <input id="fynd-foto" type="file" accept="image/*" class="file-input">
          <img id="foto-preview" alt="" hidden>
          <span id="foto-text">Ta eller välj foto</span>
        </label>

        <label class="lbl" for="fynd-not">Anteckning</label>
        <textarea id="fynd-not" rows="3" placeholder="Vid mossiga stenen under granarna"></textarea>

        <p id="fynd-msg" class="msg" role="status" aria-live="polite"></p>
        <button class="btn primary" type="submit" id="btn-save">Spara fynd</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script src="arter.js"></script>
  <script src="map.js"></script>
  <script src="fynd.js"></script>
  <script src="app.js"></script>
</body>
</html>
